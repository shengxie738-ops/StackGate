[project]
name = "stackgate-contract-drift-api"
version = "0.1.0"
description = "Synthetic FastAPI service used by the StackGate contract-drift demo"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.138.1",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
serve = [
    "uvicorn==0.49.0",
]
test = [
    "httpx==0.28.1",
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["."]
testpaths = ["tests"]
